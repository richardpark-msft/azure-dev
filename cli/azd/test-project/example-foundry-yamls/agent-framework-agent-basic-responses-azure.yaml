# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

requiredVersions:
  extensions:
    azure.ai.agents: ">=1.0.0-beta.4"
name: agent-framework-agent-basic-responses
services:
  agent-framework-agent-basic-responses:
    project: src/agent-framework-agent-basic-responses
    host: azure.ai.agent
    language: python
    # (possibly some ordering construct between services, but _also_ supported for layers)
    # also used for composability,
    uses:
      - ai-project
    codeConfiguration:
      dependencyResolution: remote_build
      entryPoint: main.py
      runtime: python_3_13
    container:
      resources:
        cpu: "0.5"
        memory: 1Gi
    description: A basic Agent Framework agent hosted by Foundry.
    environmentVariables:
      - name: AZURE_AI_MODEL_DEPLOYMENT_NAME
        value: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
    kind: hosted
    metadata:
      tags:
        - Agent Framework
        - AI Agent Hosting
        - Azure AI AgentServer
        - Responses Protocol
        - Streaming
    name: agent-framework-agent-basic-responses
    protocols:
      - protocol: responses
        version: 2.0.0
  # AZURE_AI_MODEL_DEPLOYMENT_NAME -> (probably coming from here, implicitly?)
  ai-project:
    host: azure.ai.project
    deployments:
      - model:
          format: OpenAI
          name: gpt-5.4-mini
          version: "2026-03-17"
        name: gpt-5.4-mini
        sku:
          capacity: 10
          name: GlobalStandard
infra:
  # TODO: I think Foundry team is already doing this!
  layers:
    - name: foundry_project
      provider: microsoft.foundry

  # resources:
  acr:
    provider: azure.ai
  # (this is made up by me, don't think it's real!)
  ai-project:
    provider: bicep, terraform, pulumu, -> azure.ai -> bicep
    #infra: ./infra/main.bicep
  storage:
    type: storage
    containers:
      - asdfs
